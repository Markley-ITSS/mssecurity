name: Quarterly crime stats refresh

on:
  # Schedule disabled for now -- GOV.UK's file server appears to
  # silently stall/block requests from GitHub's cloud IP ranges, so
  # this hasn't run successfully yet. The existing local Windows Task
  # Scheduler job is the real automation for this. Left as a manual
  # button (workflow_dispatch) in case it's worth retrying later.
  # schedule:
  #   - cron: "0 9 27 1,10 *"   # 27th Jan/Oct 09:00 Europe/London (GMT)
  #   - cron: "0 8 27 4,7 *"    # 27th Apr/Jul 09:00 Europe/London (BST)
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Python fully buffers stdout when it isn't a TTY, so without this a
  # hosted-runner job can sit with zero visible log output for a long
  # time even while genuinely working (e.g. odfpy is a slow pure-Python
  # ODS parser) -- which both hides real progress and risks tripping
  # GitHub's own "no output" stall-detection on the job.
  PYTHONUNBUFFERED: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas odfpy

      - name: Refresh burglary figures from ONS
        run: python scripts/update_crime_stats.py --apply --refresh-download

      - name: Sync public/ publish directory
        run: python scripts/sync_public.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security-awareness.html public/
          if git diff --cached --quiet; then
            echo "No changes -- ONS hasn't published newer data since last run."
            exit 0
          fi
          git commit -m "Quarterly crime stats refresh (automated)"
          git push
